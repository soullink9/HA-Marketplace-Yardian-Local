# Publishes GitHub's releases: yardian_local.zip and yardian_lawn_schedule.yaml, with release notes taken from that version's section of
# CHANGELOG.md. This is the copy the Marketplace installs and updates from.
# (.gitea/workflows/release.yml publishes them on Gitea first; both use the scripts in scripts/.)
#
# GitHub ends up with the same releases as Gitea: the same files, title and notes. Releases start on Gitea, and
# Gitea's push mirror brings their tags here (every 8 hours). Every push from the mirror starts this workflow:
#   1. plan: lists the version tags with no published release here yet (scripts/plan_github_releases.py).
#      Checking every tag, not only the one pushed, matters: when more than three tags arrive in one push GitHub
#      starts no workflow for any of them, and a release whose run failed gets another go at the next push.
#   2. release: for each of them, oldest first, checks out the tag, runs every check, builds the same files Gitea
#      built (the builds are repeatable, byte for byte) and publishes them with the same title and notes.
# Actions tab → Release → Run workflow does the same straight away, without waiting for the mirror.
# It never creates a tag: the mirror deletes tags Gitea doesn't have, so a tag made here wouldn't last.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*", "V*.*.*"]
  workflow_dispatch:

permissions:
  contents: write # to publish releases

# One run at a time: a mirror push that moves main and brings a tag starts this twice, and the second run then
# finds the release already published instead of racing the first to create it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # every tag, to compare with GitHub's releases

      - name: Find the version tags GitHub has no release for
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName,isDraft > releases.json
          python3 scripts/plan_github_releases.py releases.json "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    name: Release ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # one at a time, oldest version first
      fail-fast: false # a version that fails its checks doesn't hold up the others
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.tag }} # the release is built from its tag, as on Gitea

      # Home Assistant 2026.9 runs on Python 3.14 and supports nothing older, so that's what the tests run on
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check the version and take the release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ matrix.tag }}
        run: python3 scripts/release_notes.py "$TAG" "$GITHUB_REPOSITORY" notes.md >> "$GITHUB_OUTPUT"

      - name: Install what the checks need
        run: pip install -r tests/requirements.txt

      - name: Lint and format (ruff)
        run: ruff check && ruff format --check

      - name: Run every test
        run: |
          python3 tests/test_blueprint.py
          python3 tests/test_release.py

      # The asset keeps the same name in every release: .../releases/latest/download/yardian_local.zip relies on it.
      - name: Build yardian_local.zip, and check it installs as custom_components/yardian_local/
        run: python3 scripts/build_package.py

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
          LATEST: ${{ matrix.latest }}
        run: |
          # A draft on this tag is what GitHub leaves when a tag goes missing from Gitea for a while: replace it.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          # "Latest" only for the newest version without a suffix, so publishing an older version after a newer one
          # doesn't make it the one .../releases/latest/download/ hands out.
          flags=(--latest="$LATEST")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # --verify-tag: publish on the tag Gitea sent, and never create one
          gh release create "$TAG" dist/* --verify-tag --title "$TITLE" --notes-file notes.md "${flags[@]}"
